<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Banana Wars · Pozivnica</title>
</head>
<body>
<p><a id="play" href="https://banana.bogdanvuckovic.com/play">Otvori Banana Wars</a></p>
<script>
const play = document.getElementById('play');
const destination = new URL(play.href);
const match = new URLSearchParams(location.search).get('match');
if (match && /^bw-[0-9a-f]+$/.test(match)) {
  destination.searchParams.set('match', match);
  const code = new URLSearchParams(location.hash.slice(1)).get('code');
  if (code && /^[0-9a-f]{8}$/i.test(code)) destination.hash = 'code=' + code;
}
play.href = destination.href;
location.replace(play.href);
</script>
</body>
</html>
